<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a4d59" />
    </marker>
  </defs>

  <rect width="900" height="900" fill="#14151a" />

  <!-- User -->
  <rect x="380" y="20" width="140" height="44" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="450" y="47" fill="#ffffff" font-size="14" text-anchor="middle">User</text>
  <line x1="450" y1="64" x2="450" y2="90" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Frontend -->
  <rect x="330" y="90" width="240" height="44" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="450" y="117" fill="#ffffff" font-size="14" text-anchor="middle">Web Application (React)</text>
  <line x1="450" y1="134" x2="450" y2="160" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- API -->
  <rect x="330" y="160" width="240" height="44" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="450" y="187" fill="#ffffff" font-size="14" text-anchor="middle">API (FastAPI)</text>
  <line x1="450" y1="204" x2="450" y2="230" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Orchestrator -->
  <rect x="300" y="230" width="300" height="50" rx="8" fill="#0f2a30" stroke="#00d9ff" />
  <text x="450" y="260" fill="#00d9ff" font-size="15" font-weight="600" text-anchor="middle">Nexora Orchestrator</text>

  <line x1="400" y1="280" x2="320" y2="320" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="500" y1="280" x2="580" y2="320" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Classifier / Planner -->
  <rect x="200" y="320" width="200" height="44" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="300" y="347" fill="#ffffff" font-size="13" text-anchor="middle">Incident Classifier</text>

  <rect x="500" y="320" width="200" height="44" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="600" y="347" fill="#ffffff" font-size="13" text-anchor="middle">Planner</text>

  <line x1="300" y1="364" x2="450" y2="400" stroke="#4a4d59" stroke-width="1.5" />
  <line x1="600" y1="364" x2="450" y2="400" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Specialized agents row -->
  <text x="450" y="418" fill="#c9cdd3" font-size="12" text-anchor="middle" opacity="0.6">Specialized Agents</text>

  <g>
    <rect x="70"  y="430" width="150" height="46" rx="8" fill="#1b1c23" stroke="#2c2e38" />
    <text x="145" y="458" fill="#ffffff" font-size="12" text-anchor="middle">Network Agent</text>

    <rect x="240" y="430" width="150" height="46" rx="8" fill="#1b1c23" stroke="#2c2e38" />
    <text x="315" y="458" fill="#ffffff" font-size="12" text-anchor="middle">Systems Agent</text>

    <rect x="410" y="430" width="150" height="46" rx="8" fill="#1b1c23" stroke="#2c2e38" />
    <text x="485" y="450" fill="#ffffff" font-size="12" text-anchor="middle">Application</text>
    <text x="485" y="465" fill="#ffffff" font-size="12" text-anchor="middle">Agent</text>

    <rect x="580" y="430" width="150" height="46" rx="8" fill="#1b1c23" stroke="#2c2e38" />
    <text x="655" y="458" fill="#ffffff" font-size="12" text-anchor="middle">Database Agent</text>

    <rect x="680" y="430" width="150" height="46" rx="8" fill="#1b1c23" stroke="#2c2e38" opacity="0" />
  </g>
  <rect x="700" y="490" width="150" height="46" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="775" y="518" fill="#ffffff" font-size="12" text-anchor="middle">Security Agent</text>

  <!-- lines from agents down to evidence reviewer -->
  <line x1="145" y1="476" x2="450" y2="560" stroke="#4a4d59" stroke-width="1.2" />
  <line x1="315" y1="476" x2="450" y2="560" stroke="#4a4d59" stroke-width="1.2" />
  <line x1="485" y1="476" x2="450" y2="560" stroke="#4a4d59" stroke-width="1.2" />
  <line x1="655" y1="476" x2="450" y2="560" stroke="#4a4d59" stroke-width="1.2" />
  <line x1="775" y1="536" x2="450" y2="560" stroke="#4a4d59" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Evidence store -->
  <rect x="330" y="560" width="240" height="44" rx="8" fill="#1b1c23" stroke="#ff6b35" />
  <text x="450" y="587" fill="#ff6b35" font-size="14" text-anchor="middle">Evidence Reviewer</text>

  <!-- loop back arrow -->
  <path d="M 570 582 C 700 582 700 460 800 460" fill="none" stroke="#ff6b35" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <text x="700" y="510" fill="#ff6b35" font-size="10" text-anchor="middle">insufficient evidence:</text>
  <text x="700" y="522" fill="#ff6b35" font-size="10" text-anchor="middle">additional investigation</text>

  <line x1="450" y1="604" x2="450" y2="630" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="330" y="630" width="240" height="44" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="450" y="657" fill="#ffffff" font-size="14" text-anchor="middle">Root Cause Analyzer</text>
  <line x1="450" y1="674" x2="450" y2="700" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="330" y="700" width="240" height="44" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="450" y="727" fill="#ffffff" font-size="14" text-anchor="middle">Remediation Advisor</text>
  <line x1="450" y1="744" x2="450" y2="770" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="330" y="770" width="240" height="44" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="450" y="797" fill="#ffffff" font-size="14" text-anchor="middle">Report Generator</text>
  <line x1="450" y1="814" x2="450" y2="840" stroke="#4a4d59" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="380" y="840" width="140" height="44" rx="8" fill="#1b1c23" stroke="#2c2e38" />
  <text x="450" y="867" fill="#ffffff" font-size="14" text-anchor="middle">User</text>

  <!-- side notes: persistence + models -->
  <rect x="20" y="230" width="120" height="200" rx="8" fill="none" stroke="#2c2e38" stroke-dasharray="3 3" />
  <text x="80" y="250" fill="#c9cdd3" font-size="11" text-anchor="middle" opacity="0.6">PostgreSQL</text>
  <text x="80" y="266" fill="#c9cdd3" font-size="11" text-anchor="middle" opacity="0.6">(incident state)</text>

  <rect x="760" y="230" width="120" height="200" rx="8" fill="none" stroke="#2c2e38" stroke-dasharray="3 3" />
  <text x="820" y="250" fill="#c9cdd3" font-size="11" text-anchor="middle" opacity="0.6">Gemini + ADK</text>
  <text x="820" y="266" fill="#c9cdd3" font-size="11" text-anchor="middle" opacity="0.6">(optional,</text>
  <text x="820" y="280" fill="#c9cdd3" font-size="11" text-anchor="middle" opacity="0.6">LLM_PROVIDER=gemini)</text>
</svg>
