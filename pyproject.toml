[project]
name = "teklini-nexora"
version = "0.1.0"
description = "Multi-agent IT operations investigation and incident diagnosis platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Teklini Technologies" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
adk = [
    "google-adk>=0.1.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexora"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e", "tests/evaluation"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live_gemini: opt-in live Gemini/ADK provider smoke test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends(...) in argument defaults is the standard idiom.

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
